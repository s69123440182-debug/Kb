<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2b211b;color:var(--brown);font-family:var(--ui);color-scheme:light}
#app{position:fixed;inset:0;max-width:520px;margin:auto;overflow:hidden;background:var(--cream);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;animation:fi .7s}

h1,h2{font-family:var(--serif);margin:0;letter-spacing:.05em;font-weight:700}
.btn{font:600 15px var(--ui);letter-spacing:.04em;background:var(--brown);color:var(--cream);border:0;border-radius:40px;padding:15px 30px;min-height:48px;box-shadow:0 6px 18px #755b4b55;cursor:pointer}

.env{position:relative;width:250px;height:160px;background:linear-gradient(#efe3d0,#e2d1b8);border-radius:6px;box-shadow:0 14px 30px #0006;margin:18px auto}
.env .flap{position:absolute;left:0;top:0;width:100%;height:92px;background:#e9dac3;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:3;border-radius:6px 6px 0 0}
.env .v{position:absolute;inset:0;background:linear-gradient(135deg,transparent 50%,#d9c6a8 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 50%,#d9c6a8 50%) right/50% 100% no-repeat;border-radius:6px;z-index:2}
.seal{position:absolute;left:50%;top:78px;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:radial-gradient(#c97a7a,#9b4a52);z-index:4;color:#f7d9d9;display:grid;place-items:center;font-size:17px;box-shadow:0 2px 6px #0006;transition:opacity .5s}
.env.open .flap{transform:rotateX(180deg);z-index:1}.env.open .seal{opacity:0}
.wig{animation:wig .6s}@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.paper{position:absolute;left:12px;right:12px;bottom:10px;height:100px;background:#fffaf0;z-index:2;transition:all 1.4s;border-radius:3px;box-shadow:0 0 8px #0002}
.env.open .paper{transform:translateY(-190px)}
/* story */
.story p{font-family:var(--serif);font-size:19px;line-height:1.7;margin:14px 0;opacity:0;animation:fi 1.2s forwards}
/* map */
.card{width:100%;max-width:380px;border-radius:18px;padding:16px 18px;margin:9px 0;text-align:left;color:#fff;position:relative;overflow:hidden;box-shadow:0 8px 20px #755b4b44;cursor:pointer;border:0;font-family:var(--ui)}
.card h3{margin:0;font:700 17px var(--serif);letter-spacing:.1em}.card small{opacity:.95}
.card.locked{filter:grayscale(.9) brightness(.85);cursor:default}.card .st{position:absolute;right:14px;top:14px;font-size:22px}
/* explore */
.scene{position:absolute;inset:0;overflow:hidden}
.obj{position:absolute;background:none;border:0;font-size:38px;padding:6px;transform:translate(-50%,-50%) translateZ(70px);filter:drop-shadow(0 6px 4px #0005);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translate(-50%,-56%) translateZ(95px) rotateY(14deg)}}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:10;background:#f7f1eef2;border-radius:24px 24px 0 0;padding:16px 18px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px #0003;max-height:46%;overflow:auto;text-align:left}
.panel h3{margin:0 0 2px;font:700 15px var(--serif);letter-spacing:.1em}.panel p{margin:6px 0 10px;font-size:14px;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input.t{flex:1;min-width:0;font:16px var(--ui);padding:12px 14px;border-radius:12px;border:1.5px solid var(--beige);background:#fff;color:var(--brown)}
.opt{font-size:30px;background:#fff;border:1.5px solid var(--beige);border-radius:14px;width:58px;height:58px}
.dots span{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--beige);margin-right:5px}.dots .on{background:var(--pink)}
/* modal */
.mod{position:absolute;inset:0;z-index:60;background:#2b211b99;display:flex;align-items:center;justify-content:center;padding:22px;animation:fi .3s}
.mod>div{background:var(--cream);border-radius:20px;padding:22px;max-width:360px;width:100%;max-height:85%;overflow:auto;text-align:center;box-shadow:0 20px 50px #0007;background-image:linear-gradient(#e8dccb44 1px,transparent 1px);background-size:100% 26px}
.mod p{font:16px/1.6 var(--hand);margin:8px 0 16px;white-space:pre-line}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.slot{aspect-ratio:1;border-radius:10px;background:var(--beige);display:grid;place-items:center;font-size:11px;padding:4px}.slot.has{background:#fffaf0;border:1.5px solid var(--pink);font-size:24px}
.thumbs img{width:70px;height:70px;object-fit:cover;border:4px solid #fff;box-shadow:0 2px 6px #0003;margin:3px}
.toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:70;font:700 15px var(--serif);letter-spacing:.04em;background:var(--brown);color:var(--cream);padding:14px 22px;border-radius:30px;text-align:center;animation:fi .5s;box-shadow:0 8px 24px #0005}
.fly{position:absolute;z-index:80;font-size:46px;transition:all 1.1s cubic-bezier(.6,0,.4,1)}
/* camera */
#cam{position:absolute;inset:0;z-index:55;background:#000;display:flex;flex-direction:column;color:#fff}
#cam video,#cam .pv{flex:1;min-height:0;width:100%;object-fit:cover;background:#222}
.vf{position:absolute;left:12%;right:12%;top:20%;bottom:34%;border:2px solid #fffd;border-radius:14px;pointer-events:none;box-shadow:0 0 0 999px #0003;display:flex;align-items:flex-end;justify-content:center;padding:8px;font-size:13px;text-align:center}
.cbar{padding:14px;display:flex;justify-content:space-around;align-items:center;background:#000;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.shut{width:70px;height:70px;border-radius:50%;border:5px solid #fff;background:#fff6;cursor:pointer}
.cbar button,.cbar label{background:#fff2;color:#fff;border:0;border-radius:20px;padding:10px 14px;font:13px var(--ui)}

.sheet i{display:block;height:2px;background:#d9c6a8;margin:15px 0}
#lt{font:17px/1.8 var(--hand);white-space:pre-wrap;text-align:left;color:#5a4336}
.lp{background:#fffaf0;width:100%;max-width:340px;min-height:330px;max-height:42vh;overflow:auto;padding:22px;border-radius:4px;box-shadow:0 10px 30px #755b4b55;background-image:linear-gradient(#e8dccb88 1px,transparent 1px);background-size:100% 31px;animation:fi 1.4s}
#main{perspective:900px;--px:0;--py:0}
.scene{perspective:800px}
.w3{position:absolute;inset:-4%;transform-style:preserve-3d;transform:rotateX(calc(var(--py)*-5deg)) rotateY(calc(var(--px)*7deg));transition:transform .15s linear}
.chr{width:44px;height:98px;overflow:visible;transform-origin:50% 100%;animation:wk 1.3s ease-in-out infinite;filter:drop-shadow(0 6px 4px #0004)}
.chr+.chr{animation-delay:-.45s}@keyframes wk{50%{transform:translateY(-5px) rotate(3deg)}}
.chr3{position:absolute;pointer-events:none;transform:translateZ(130px) scale(.75)}
.duo{display:flex;gap:4px;justify-content:center;perspective:500px;margin-bottom:6px}
.env{transform-style:preserve-3d;transform:rotateX(16deg) rotateY(-10deg);animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotateX(8deg) rotateY(12deg)}}
.card{transform:perspective(600px) rotateX(5deg);transition:transform .2s}.card:active{transform:perspective(600px) rotateX(0) scale(.97)}
.ph3{display:flex;gap:10px;justify-content:center;margin-top:14px;perspective:700px}
.ph3 img{width:84px;height:106px;object-fit:cover;border:5px solid #fffaf0;border-bottom-width:17px;box-shadow:0 10px 18px #0004;transform:rotate(var(--r)) rotateY(calc(var(--px)*22deg));animation:fi 1.6s}
.lp{transform:perspective(900px) rotateX(calc(var(--py)*-4deg)) rotateY(calc(var(--px)*5deg))}
#fl span,#fl{animation:fl3 6s ease-in-out infinite}@keyframes fl3{50%{transform:translateY(-10px) rotateY(25deg)}}
.c3d{width:170px;height:120px;display:block;pointer-events:none}.chr3{transform-origin:0 0}
.l3d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}#lv{position:relative;z-index:2}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.15em;overflow:visible}
.obj .ico{width:54px;height:54px}.opt .ico,#sq .ico{width:36px;height:36px}#hud button .ico{width:26px;height:26px}.card .st .ico{width:26px;height:26px}.btn .ico{width:1.2em;height:1.2em}.mod .ico,.slot .ico{width:28px;height:28px}
.fw{transform-origin:24px 24px;animation:fw .35s ease-in-out infinite alternate}@keyframes fw{to{transform:scaleX(.45)}}
.hd{transform-origin:24px 24px;animation:spn 6s linear infinite}.hd2{transform-origin:24px 24px;animation:spn 72s linear infinite}.sp{transform-origin:24px 24px;animation:spn 14s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.sw{transform-origin:24px 46px;animation:swy 3.2s ease-in-out infinite}@keyframes swy{50%{transform:rotate(7deg)}}
.cl{transform-origin:12px 26px;animation:clw 1s ease-in-out infinite alternate}.cl2{transform-origin:36px 26px;animation:clw 1s -.5s ease-in-out infinite alternate reverse}@keyframes clw{to{transform:rotate(-18deg)}}

if(cur.type=="tap")M.querySelectorAll(".obj").forEach(b=>b.onclick=()=>{const o=cur.objs[b.dataset.i];if(o.ok){sfx.ok();modal(`<h2 style="font-size:16px">คำใบ้</h2><p>${cur.clue}</p>`,[["เก็บชิ้นส่วน",()=>finish(cur,b)]])}else{sfx.bad();b.classList.add("shake");toast("ไม่ใช่สิ่งนี้… ลองดูอีกครั้ง",1200);setTimeout(()=>b.classList.remove("shake"),400)}});
if(cur.type=="cam")$("#oc").onclick=()=>camera(cur);
if(cur.type=="riddle")$("#ak").onclick=()=>{const v=$("#an").value.trim().toLowerCase().replace(/\s/g,"");if(cur.ans.some(a=>v.includes(a.toLowerCase().replace(/\s/g,""))&&v))modal(`<p>${cur.clue}</p>`,[["เก็บชิ้นส่วน",()=>finish(cur,$("#ak"))]]);else{sfx.bad();$(".panel").classList.add("shake");toast("ยังไม่ใช่… ลองใหม่อีกครั้งนะ",1300);setTimeout(()=>$(".panel").classList.remove("shake"),400)}};
if(cur.type=="seq"){M.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{seq.push(b.dataset.o);$("#sq").innerHTML=seq.map(ic).join(" › ")||"…";if(seq.length==cur.order.length){if(seq.join()==cur.order.join()){sfx.ok();const s=cur;seq=[];finish(s,b)}else{sfx.bad();seq=[];$(".panel").classList.add("shake");toast("ลำดับยังไม่ถูก ลองใหม่นะ",1300);setTimeout(explore,450)}}});$("#cl").onclick=()=>{seq=[];$("#sq").innerHTML="…"}}}
function finish(mi,from){S.done[mi.id]=1;save();sfx.piece();const r=from.getBoundingClientRect(),f=document.createElement("div");f.className="fly";f.innerHTML=ic("scroll");f.style.left=r.left+"px";f.style.top=r.top+"px";$("#app").appendChild(f);const t=$("#iv").getBoundingClientRect();requestAnimationFrame(()=>{f.style.left=t.left+"px";f.style.top=t.top+"px";f.style.fontSize="16px";f.style.transform="rotate(300deg)"});toast("พบชิ้นส่วนความทรงจำแล้ว",2400);setTimeout(()=>{f.remove();hud(1);go(cnt()==9||memDone(S.mem)?"map":"explore")},1300)}
// ---- camera
let stream,facing="environment";
function camera(cur){const c=document.createElement("div");c.id="cam";c.innerHTML=`<div style="position:relative;flex:1;display:flex;min-height:0"><video playsinline muted autoplay></video><div class="vf">${ic("target")} ${cur.target}</div><div id="ce" style="position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;right:14px;font-size:13px;text-align:center"></div></div><div class="cbar"><button id="cx">✕ ปิด</button><button class="shut" id="sh"></button><button id="sw">${ic("swap")} สลับ</button></div><div class="cbar" style="padding-top:0"><label>${ic("img")} เลือกจากแกลลเลอรี<input type="file" accept="image/*" id="gl" hidden></label><button id="dm">${ic("spark")} โหมดเดโม่</button></div>`;$("#app").appendChild(c);
const v=c.querySelector("video");const stop=()=>{stream&&stream.getTracks().forEach(t=>t.stop());stream=null};
async function start(){stop();try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});v.srcObject=stream;v.play().catch(()=>{})}catch(e){$("#ce").textContent="ไม่สามารถเปิดกล้องได้ (ไม่ได้อนุญาตหรืออุปกรณ์ไม่รองรับ) — เลือกจากแกลลเลอรีหรือใช้โหมดเดโม่แทนได้เลย"}}
const preview=url=>{stop();c.innerHTML=`<img class="pv" src="${url}"><div class="cbar"><button id="rt">↺ ถ่ายใหม่</button><button id="us" style="background:#DCA9A9;color:#fff">✓ ใช้รูปนี้</button></div>`;$("#rt").onclick=()=>{c.remove();camera(cur)};$("#us").onclick=()=>{S.ph[cur.id]=url;c.remove();finish(cur,$("#oc"))}};
const fromSrc=(el,w,h)=>{const k=document.createElement("canvas"),s=Math.min(1,480/w);k.width=w*s;k.height=h*s;const x=k.getContext("2d");x.drawImage(el,0,0,k.width,k.height);x.fillStyle="#fff3";x.fillRect(0,0,0,0);return k.toDataURL("image/jpeg",.72)};
$("#cx").onclick=()=>{stop();c.remove()};$("#sw").onclick=()=>{facing=facing=="environment"?"user":"environment";start()};
$("#sh").onclick=()=>{if(!v.videoWidth){toast("กล้องยังไม่พร้อม",1200);return}sfx.shutter();preview(fromSrc(v,v.videoWidth,v.videoHeight))};
$("#gl").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>preview(fromSrc(im,im.width,im.height));im.src=URL.createObjectURL(f)};
$("#dm").onclick=()=>{const k=document.createElement("canvas");k.width=360;k.height=480;const x=k.getContext("2d"),g=x.createLinearGradient(0,0,0,480);g.addColorStop(0,"#f6b98a");g.addColorStop(1,"#DCA9A9");x.fillStyle=g;x.fillRect(0,0,360,480);x.fillStyle="#fff8";x.beginPath();x.arc(180,220,60,0,7);x.fill();x.fillStyle="#fff";x.font="20px serif";x.textAlign="center";x.fillText("DEMO · "+cur.target,180,400);sfx.shutter();preview(k.toDataURL("image/jpeg",.8))};
start()}
// ---- inventory
function inv(){const ph=Object.entries(S.ph);modal(`<h2 style="font-size:17px">กระเป๋าความทรงจำ</h2><div style="font-size:13px">${cnt()}/9 ชิ้นส่วน</div><div class="grid9">${ALL.map((x,i)=>`<div class="slot ${S.done[x.id]?"has":""}">${S.done[x.id]?ic("scroll")+"<br><span style='font-size:10px'>"+CFG.memories[x.mi].title+"</span>":"?"}</div>`).join("")}</div>${ph.length?`<div class="thumbs">${ph.map(p=>`<img src="${p[1]}">`).join("")}</div>`:""}`,[["ปิด"]])}
// ---- final puzzle
function final(){const B=Math.min(innerWidth-40,330),C=B/3,T=C*.6,H=B+T*2+90;let ord=[0,1,2,3,4,5,6,7,8].sort(()=>Math.random()-.5);const L=CFG.letter;
const sheet=(ox,oy)=>`<div class="sheet" style="left:${ox}px;top:${oy}px;width:${B}px;height:${B}px"><div style="font-size:${B/11}px;font-weight:600">${L.greeting}</div><i></i><i></i><i></i><i></i><i></i><i></i><div style="font-size:${B/9}px;text-align:right">♥</div></div>`;
M.innerHTML=`<div class="scr desk" style="justify-content:flex-start;padding-top:calc(70px + env(safe-area-inset-top))"><h2 style="font-size:18px;color:#fff8ea">ประกอบจดหมายคืนร่าง</h2><div style="color:#fff3dc;font-size:13px;margin:6px 0 10px">ชิ้นส่วนกำลังกลับเข้าที่ทีละชิ้น… · <b id="fc">0/9</b></div><div id="fp" style="width:${B}px;height:${H-60}px"></div></div>`;
const fp=$("#fp"),pcs=[];for(let i=0;i<9;i++){const d=document.createElement("div");d.className="cell";d.style.cssText=`left:${i%3*C}px;top:${Math.floor(i/3)*C}px;width:${C}px;height:${C}px`;fp.appendChild(d)}
const upd=()=>{$("#fc").textContent=S.placed.length+"/9"};
const slot=k=>{const j=ord.indexOf(k);return[(j%5)*T+(B-5*T)/2,B+14+Math.floor(j/5)*(T+8)]};
const put=(el,x,y,s)=>el.style.transform=`translate(${x}px,${y}px) scale(${s})`;
for(let i=0;i<9;i++){const p=document.createElement("div");p.className="pc";p.style.cssText=`width:${C}px;height:${C}px`;p.innerHTML=sheet(-(i%3)*C,-Math.floor(i/3)*C);fp.appendChild(p);pcs.push(p);
if(S.placed.includes(i))put(p,i%3*C,Math.floor(i/3)*C,1);else put(p,...slot(i),.6);
let dr=0;p.onpointerdown=e=>{return;dr=1;p.setPointerCapture(e.pointerId);p.classList.add("drag");const r=fp.getBoundingClientRect();put(p,e.clientX-r.left-C/2,e.clientY-r.top-C/2,1)};
p.onpointermove=e=>{if(!dr)return;const r=fp.getBoundingClientRect();put(p,e.clientX-r.left-C/2,e.clientY-r.top-C/2,1)};
p.onpointerup=e=>{if(!dr)return;dr=0;p.classList.remove("drag");const r=fp.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,cell=Math.floor(y/C)*3+Math.floor(x/C);
if(x>=0&&y>=0&&x<B&&y<B&&cell==i){S.placed.push(i);save();put(p,i%3*C,Math.floor(i/3)*C,1);sfx.ok();upd();if(S.placed.length==9)setTimeout(done,500)}else{if(x>=0&&y>=0&&y<B)sfx.bad();put(p,...slot(i),.6)}}}
upd();if(S.placed.length==9)done();else[0,1,2,3,4,5,6,7,8].filter(i=>!S.placed.includes(i)).forEach((i,n)=>setTimeout(()=>{if(!fp.isConnected)return;put(pcs[i],i%3*C,Math.floor(i/3)*C,1);S.placed.push(i);save();sfx.ok();upd();if(S.placed.length==9)setTimeout(done,900)},1000+n*600));
function done(){fp.querySelectorAll(".cell").forEach(c=>c.style.opacity=0);pcs.forEach(p=>p.style.boxShadow="none");tone(784,.8,0,"triangle");setTimeout(()=>{S.fin=1;save();toast("จดหมายกลับมาสมบูรณ์แล้ว",1800);setTimeout(()=>go("sky"),1900)},900)}}
// ---- letter
function letter(){hud(0);L3.open=L3.rd=0;M.innerHTML=`<div class="scr" style="background:radial-gradient(circle at 50% 30%,#fff8e8,var(--beige))"><canvas id="l3d" class="l3d"></canvas><div id="fl" style="position:absolute;inset:0;pointer-events:none;font-size:34px;opacity:.7">${ic("blossom")}<span style="position:absolute;right:20px;top:60px">${ic("daisy")}</span><span style="position:absolute;left:30px;bottom:90px">${ic("tulip")}</span><span style="position:absolute;right:40px;bottom:50px">${ic("blossom")}</span></div>
<div id="lv"><h2 style="font-size:24px">คุณเจอแล้ว</h2><p style="font:italic 17px var(--serif)">ทุกชิ้นส่วนเล็ก ๆ พาคุณมาถึงตรงนี้</p><div class="env" id="ev"><div class="flap"></div><div class="v"></div><div class="seal">♥</div></div><button class="btn" id="op">เปิดจดหมาย</button></div></div>`;
if(mkLetter($("#l3d"))){$("#ev").style.visibility="hidden";$("#fl").remove()}else $("#l3d").remove();
$("#op").onclick=()=>{L3.open=1;sfx.open();music(1);$("#ev").classList.add("open");setTimeout(show,1500)}}
function show(){L3.rd=1;const L=CFG.letter,txt=Array.from(L.greeting+"\n\n"+L.message+"\n\n"+L.signature);$("#lv").innerHTML=`<div class="lp"><div id="lt"></div></div>${(CFG.letterPhotos||[]).length?`<div class="ph3">${CFG.letterPhotos.map((u,i)=>`<img src="${u}" style="--r:${[-6,3,-3,5][i%4]}deg">`).join("")}</div>`:""}<div class="row" style="justify-content:center;margin-top:16px"><button class="btn alt sm" id="rp">อ่านอีกครั้ง</button><button class="btn sm" id="bm">กลับไปที่ความทรงจำ</button></div>`;
let i=0,el=$("#lt"),iv=setInterval(()=>{el.textContent=txt.slice(0,++i).join("");el.parentNode.scrollTop=1e5;if(i>=txt.length)clearInterval(iv)},55);
$("#rp").onclick=()=>{clearInterval(iv);show()};$("#bm").onclick=()=>{clearInterval(iv);go("map")}}
// ---- init
$("#bk").onclick=()=>go(S.scr=="explore"?"map":S.scr=="final"?"map":"map");
$("#iv").onclick=inv;
$("#sd").onclick=()=>{S.snd=!S.snd;save();$("#sd").innerHTML=ic(S.snd?"snd":"mute");music(S.snd&&S.scr!="intro")};
for(let i=0;i<14;i++){const d=document.createElement("i");d.style.cssText=`left:${Math.random()*100}%;animation-duration:${9+Math.random()*10}s;animation-delay:-${Math.random()*10}s`;$("#dust").appendChild(d)}
if(S.scr=="letter"&&S.fin)S.scr="final";if(!["intro","story"].includes(S.scr)&&!cnt()&&S.scr!="map")S.scr="map";
go(S.scr=="explore"||S.scr=="final"||S.scr=="map"?S.scr:"opening");
</script></body></html>
